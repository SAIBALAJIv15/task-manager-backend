services:
  database:
    image: mysql:8.0
    container_name: taskdb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootPass2026
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskapp
      MYSQL_PASSWORD: TaskApp2026
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: taskmanager-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: taskapp
      SPRING_DATASOURCE_PASSWORD: TaskApp2026
    depends_on:
      database:
        condition: service_healthy

volumes:
  db-data:
