services:

  mysql:
    image: mysql:8.0
    container_name: task-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskapp
      MYSQL_PASSWORD: TaskApp2026
      MYSQL_ROOT_PASSWORD: RootPass2026
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/seed-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPass2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKER_IMAGE_BE}:${DOCKER_TAG:-latest}
    container_name: task-manager-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: taskapp
      SPRING_DATASOURCE_PASSWORD: TaskApp2026
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: ${DOCKER_IMAGE_FE}:${DOCKER_TAG:-latest}
    container_name: task-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
