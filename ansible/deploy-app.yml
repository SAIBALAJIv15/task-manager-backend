---
- name: Deploy 3-Tier Task Manager Application
  hosts: appservers
  become: yes

  vars:
    docker_image_be: "taskmanager/backend"
    docker_image_fe: "taskmanager/frontend"
    docker_tag: "latest"
    app_dir: /opt/task-manager
    app_port: 80

  tasks:

    - name: Install Docker (if not present)
      dnf:
        name: docker
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose plugin
      dnf:
        name: docker-compose-plugin
        state: present

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        mode: '0755'

    - name: Create scripts directory
      file:
        path: "{{ app_dir }}/scripts"
        state: directory
        owner: ec2-user

    - name: Create nginx config directory
      file:
        path: "{{ app_dir }}/nginx"
        state: directory
        owner: ec2-user

    - name: Copy docker-compose.yml
      copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Copy seed data SQL
      copy:
        src: ../scripts/seed-data.sql
        dest: "{{ app_dir }}/scripts/seed-data.sql"

    - name: Copy Nginx config
      copy:
        src: ../nginx/default.conf
        dest: "{{ app_dir }}/nginx/default.conf"

    - name: Pull backend image
      community.docker.docker_image:
        name: "{{ docker_image_be }}"
        tag: "{{ docker_tag }}"
        source: pull

    - name: Pull frontend image
      community.docker.docker_image:
        name: "{{ docker_image_fe }}"
        tag: "{{ docker_tag }}"
        source: pull

    - name: Deploy application stack with Docker Compose
      shell: |
        cd {{ app_dir }}
        export DOCKER_IMAGE_BE={{ docker_image_be }}
        export DOCKER_IMAGE_FE={{ docker_image_fe }}
        export DOCKER_TAG={{ docker_tag }}
        docker compose down || true
        docker compose up -d

    - name: Wait for application to be healthy
      uri:
        url: "http://localhost:{{ app_port }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 15
      delay: 5
